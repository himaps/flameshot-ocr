# Kylin V20 / V10 SP1 / UOS release, following the 银河麒麟 domestic-adaptation
# guide: BUILD in the real-Kylin devel container (distrotwin/kylin, bootstrapped
# from Kylin's public apt archives — the toolchain and every runtime package are
# Kylin's own), then VERIFY the offline deb on a clean Kylin base container
# before publishing. Payload self-checks, glibc gate and annotation-based
# failure diagnostics per the same guide.
#
# Native runners (no cross compilation). Pushes to master build automatically;
# a v* tag also attaches the debs to the tag's GitHub release (release is gated
# on the real-Kylin verify job); any branch can be built through workflow_dispatch.
name: Kylin V20 / UOS release

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kylin-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-deb:
    name: Build kylin-${{ matrix.osarch }} packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
            multiarch: aarch64-linux-gnu
            osarch: kylin-aarch64
          - arch: amd64
            runner: ubuntu-24.04
            multiarch: x86_64-linux-gnu
            osarch: kylin-amd64
    # Native runners produce native builds. Build in the real Kylin V10 SP1
    # devel container (desktop V10 SP1 2503: glibc 2.31, GCC 9.3, Ubuntu
    # 20.04 bloodline): the compiler, Qt (5.12), Tesseract and every package
    # in the offline closure are exactly what a Kylin machine sees, so there
    # is no cross-distro version guessing at all. Older UOS 20 (glibc 2.28)
    # is a different generation — build on-device for it.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    container:
      image: ghcr.io/distrotwin/kylin:v10sp1-devel-${{ matrix.arch }}-20260903
    env:
      DEBIAN_FRONTEND: noninteractive
      # the container's pkg-config does not search the multiarch pkgconfig
      # directory on its own
      PKG_CONFIG_PATH: /usr/lib/${{ matrix.multiarch }}/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig

    steps:
      - name: Install build dependencies
        run: |
          set -o pipefail
          {
            set -e
            for attempt in 1 2 3 4; do
              if apt-get update; then
                break
              fi
              echo "apt-get update failed (attempt $attempt), retrying in 20s" >&2
              if [ "$attempt" = "4" ]; then
                exit 1
              fi
              sleep 20
            done
            # devel 档已带 build-essential/pkg-config/dpkg-dev；这里补项目所需：
            # Qt5 (Core/Gui/Widgets/Network/DBus/Svg/LinguistTools) 与 OCR 栈
            # （pkg-config 模块 "tesseract"/"lept" 来自 libtesseract-dev 和
            # libleptonica-dev）。qttools5-dev 提供 Qt5LinguistTools 的 CMake
            # 配置，qttools5-dev-tools 提供 lrelease 可执行文件，缺一不可。
            for attempt in 1 2 3; do
              if apt-get install -y --no-install-recommends -o Acquire::Retries=5 \
                cmake pkg-config git curl ca-certificates \
                qtbase5-dev libqt5svg5-dev qttools5-dev qttools5-dev-tools \
                libtesseract-dev libleptonica-dev; then
                break
              fi
              echo "apt-get install failed (attempt $attempt), retrying in 30s" >&2
              if [ "$attempt" = "3" ]; then
                exit 1
              fi
              sleep 30
            done
          } 2>&1 | tee build-deps.log

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trust the workspace in git
        run: |
          # after checkout in a container the workspace may be owned by a
          # different uid; without this, git describe and the CMake build
          # (which runs "git rev-parse" itself) fail with "dubious ownership"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure version name
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            VERSION="${VERSION#v}"
          else
            VERSION="$(git describe --tags --always 2>/dev/null | sed 's/^v//' || true)"
          fi
          # a Debian version must start with a digit; a bare git describe SHA
          # (no tags in the repo) would be rejected by dpkg-deb
          case "$VERSION" in
            ''|[^0-9]*) VERSION="0.0.0-${VERSION:-manual}" ;;
          esac
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION} for ${{ matrix.arch }}"

      - name: Build
        run: |
          set -o pipefail
          {
            # configure-time FetchContent clones Qt-Color-Widgets (GitLab) and
            # SingleApplication (GitHub); git + network must be available
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
            make -C build -j"$(nproc)"
          } 2>&1 | tee build.log

      - name: Stage install tree
        run: |
          make -C build install DESTDIR="$PWD/staging" 2>&1 | tee stage.log

      - name: Assert the glibc 2.31 baseline on the binary
        # glibc symbol versions are frozen into the binary at link time and
        # are the hard floor for every target machine. Fail loudly here
        # instead of shipping a deb that dies with
        # "version 'GLIBC_X.YZ' not found" on Kylin.
        run: |
          set -e
          MAXGL="$(objdump -T staging/usr/bin/flameshot | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -1 || true)"
          echo "highest GLIBC symbol required by the binary: ${MAXGL:-none}"
          if [ -n "$MAXGL" ] && ! dpkg --compare-versions "${MAXGL#GLIBC_}" le 2.31; then
            echo "ERROR: the binary requires $MAXGL, exceeding the glibc 2.31 baseline" >&2
            exit 1
          fi

      - name: Build deb package
        run: |
          set -o pipefail
          export PS4='+L$LINENO: '
          VERSION="${{ steps.ver.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          PKGDIR="pkg/flameshot-ocr_${VERSION}_${ARCH}"
          DEBOUT="pkg/flameshot-ocr-${VERSION}-${{ matrix.osarch }}.deb"
          {
            set -x
            mkdir -p "${PKGDIR}/DEBIAN"
            cp -a staging/. "${PKGDIR}/"
            cat > "${PKGDIR}/DEBIAN/control" <<EOF
          Package: flameshot-ocr
          Version: ${VERSION}
          Architecture: ${ARCH}
          Maintainer: flameshot-ocr Kylin/UOS customization
          Section: graphics
          Priority: optional
          Description: Screenshot tool with built-in OCR (Kylin V20 ${ARCH} build)
           Flameshot fork: capture any screen region, pick the OCR tool (O)
           and the recognized text lands on the clipboard. Recognition runs
           locally via Tesseract, fully offline. All Flameshot 12.1 capture
           and annotation features are preserved.
           The binary stays /usr/bin/flameshot; remove a distro flameshot
           package before installing to avoid a file conflict.
           Built without strict Depends; install with "dpkg -i".
          EOF
            dpkg-deb --build --root-owner-group "${PKGDIR}" "${DEBOUT}"
            # post-build payload self-check: the application must actually be
            # inside the deb (an earlier offline-deb bug shipped only the
            # dependency closure and was caught by a size comparison)
            dpkg-deb -c "${DEBOUT}" > /tmp/pkglist.txt
            grep -F "usr/bin/flameshot" /tmp/pkglist.txt > /dev/null \
              || { echo "ERROR: app binary missing from ${DEBOUT}" >&2; exit 1; }
            grep -F "org.flameshot.Flameshot.desktop" /tmp/pkglist.txt > /dev/null \
              || { echo "ERROR: desktop file missing from ${DEBOUT}" >&2; exit 1; }
            echo "payload self-check passed for ${DEBOUT}"
          } 2>&1 | tee package.log

      - name: Build offline deb package
        run: |
          set -o pipefail
          export PS4='+L$LINENO: '
          VERSION="${{ steps.ver.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          PKGDIR="pkg/flameshot-ocr_${VERSION}_${ARCH}-offline"
          DEBOUT="pkg/flameshot-ocr-${VERSION}-${{ matrix.osarch }}-offline.deb"
          {
            set -x
            mkdir -p "${PKGDIR}/DEBIAN"
            cp -a staging/. "${PKGDIR}/"

            # Bundle the runtime dependency closure so the app can be
            # installed and run on machines without network access.
            # install-deps.sh installs only what is missing; libraries that
            # already exist on the system are used as-is.
            mkdir -p "${PKGDIR}/usr/share/flameshot-ocr/deps" /tmp/offline-cache
            LIBS="$(ldd staging/usr/bin/flameshot | awk '{print $1}' | sort -u)"
            echo "linked libs: $LIBS"
            TOP=""
            for lib in $LIBS; do
              # dpkg -S exits 1 for loader-internal libs (linux-vdso etc.);
              # || true keeps set -e from exiting silently on the assignment
              p="$(dpkg -S "$lib" 2>/dev/null | head -1 | cut -d: -f1 || true)"
              [ -n "$p" ] && TOP="$TOP $p"
            done
            echo "offline deps direct closure:$TOP"
            # ldd only sees shared libraries linked at startup. Two more
            # runtime requirements are invisible to it: the OCR engine reads
            # traineddata (arch-independent packages), and Qt loads SVG icon
            # rendering as a dlopen'd plugin from libqt5svg5 - the binary's
            # DT_NEEDED has no libQt5Svg because of --as-needed. Seed them
            # explicitly or OCR and the toolbar icons break on offline
            # machines.
            TOP="$TOP tesseract-ocr-eng tesseract-ocr-osd libqt5svg5"
            # Expand to the full recursive Depends closure: target distros
            # (e.g. Kylin V20, Ubuntu 20.04 base) package some libraries under
            # different names, so the bundle must contain every indirect
            # dependency for dpkg -i to succeed offline.
            PKGS="$TOP"
            for round in 1 2 3 4 5; do
              rm -rf /tmp/offline-cache
              mkdir -p /tmp/offline-cache
              apt-get install --reinstall --download-only --no-install-recommends \
                -y -o Dir::Cache::archives="/tmp/offline-cache" $PKGS >/dev/null
              MORE=""
              for f in /tmp/offline-cache/*.deb; do
                deps="$(dpkg-deb -f "$f" Depends 2>/dev/null | sed 's/ ([^)]*)//g' | tr ',' '\n' | sed 's/|.*//; s/^ *//; s/ *$//' | grep -v '^$' || true)"
                MORE="$MORE $deps"
              done
              NEW="$(echo $PKGS $MORE | tr ' ' '\n' | sort -u | tr '\n' ' ')"
              CUR="$(echo $PKGS | tr ' ' '\n' | sort -u | tr '\n' ' ')"
              if [ "$NEW" = "$CUR" ]; then
                echo "closure stable after round $round ($(echo $NEW | wc -w) packages)"
                break
              fi
              PKGS="$NEW"
              echo "closure round $round grew to $(echo $NEW | wc -w) packages"
            done
            for f in /tmp/offline-cache/*.deb; do
              p="$(dpkg-deb -f "$f" Package)"
              [ "$(dpkg-deb -f "$f" Essential)" = "yes" ] && continue
              # glibc must never be replaced by a bundled copy
              [ "$p" = "libc6" ] && continue
              # GCC runtime: the distro owns it. Bundling it buys nothing on
              # a healthy system and exact-version Depends of libstdc++/gcc
              # runtime packages are a classic configure-failure cascade
              # when they disagree with the target's toolchain packages
              [ "$p" = "libgomp1" ] && continue
              cp "$f" "${PKGDIR}/usr/share/flameshot-ocr/deps/"
            done
            cat > "${PKGDIR}/usr/share/flameshot-ocr/install-deps.sh" <<'SH'
          #!/bin/sh
          # Install or upgrade the runtime dependencies bundled in ./deps:
          # packages installed at an equal or newer version are kept (the system
          # copy is used), older or missing ones are installed from the bundle.
          set -e
          BIN=/usr/bin/flameshot
          if [ ! -e "$BIN" ]; then
            echo "ERROR: $BIN is missing; the package payload is broken." >&2
            exit 1
          fi
          DIR="$(cd "$(dirname "$0")" && pwd)/deps"
          cd "$DIR"
          MISSING=""
          # Qt 5.x minor releases are ABI-compatible for apps built against
          # older Qt, but not the other way round: the binary is built on Qt
          # 5.15, so an older system Qt (the Kylin V10 SP1 desktop ships
          # 5.12) must be upgraded - all libqt5* packages together. For every
          # other package only fill gaps: never replace what the distro has
          # (Kylin customizes its X11/GL/krb5 stack, and closure copies from
          # carry exact-version Depends like "libgl1 (= libglx0)" that blow
          # up mid-install when mixed with Kylin's).
          is_qt() { case "$1" in libqt5*) return 0 ;; *) return 1 ;; esac; }
          for f in *.deb; do
            pkg="$(dpkg-deb -f "$f" Package)"
            ver="$(dpkg-deb -f "$f" Version)"
            stat="$(dpkg-query -W -f='${db:Status-Abbrev}' "$pkg" 2>/dev/null || true)"
            case "$stat" in
              ii*)
                inst="$(dpkg-query -W -f='${Version}' "$pkg" 2>/dev/null || true)"
                if is_qt "$pkg" && ! dpkg --compare-versions "${inst:-0}" ge "$ver"; then
                  echo "$pkg: system $inst is older, upgrading with $f ($ver)"
                else
                  echo "$pkg: system has $inst, keeping it"
                  continue
                fi
                ;;
              *)
                echo "$pkg: missing, will install $f ($ver)"
                ;;
            esac
            MISSING="$MISSING $f"
          done
          if [ -n "$MISSING" ]; then
            # single dpkg call so packages configure in dependency order.
            # --force-depends-version is defensive: the closure normally comes
            # from the same archive as the target (versions match exactly),
            # but if the archive moved between build and install, version
            # clauses from a different snapshot carry no truth on this
            # machine — name-level dependencies are still enforced.
            dpkg -i --force-depends-version $MISSING
          else
            echo "nothing to install"
          fi
          echo ""
          STILL="$(ldd "$BIN" 2>/dev/null | awk '/not found/ {print $1}')"
          if [ -n "$STILL" ]; then
            echo "WARNING: these libraries are still missing, the app will not start:"
            echo "$STILL"
            exit 1
          fi
          echo "OK: all runtime libraries resolved. flameshot-ocr is ready."
          SH
            chmod 755 "${PKGDIR}/usr/share/flameshot-ocr/install-deps.sh"
            cat > "${PKGDIR}/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          # dpkg holds its lock while this script runs, so the bundled dependency
          # debs cannot be installed here directly. Detect missing libraries and
          # schedule the installer to run via systemd once the lock is released.
          if [ ! -e /usr/bin/flameshot ]; then
            # fail loudly: a silent skip here would look like a healthy install
            echo "flameshot-ocr: ERROR: /usr/bin/flameshot is missing; the package payload is broken." >&2
            exit 1
          fi
          # ldd cannot see Qt symbol versions: the Kylin V10 SP1 desktop's Qt
          # 5.12 "resolves" every lib of a binary built on Qt 5.15, and the
          # app still fails at startup. Do not gate on ldd here - always
          # schedule the installer; it is version-aware and finishes instantly
          # when nothing needs changing.
          MISSING="$(ldd /usr/bin/flameshot 2>/dev/null | awk '/not found/ {print $1}')"
          if [ -n "$MISSING" ]; then
            echo "flameshot-ocr: missing runtime libraries:"
            echo "$MISSING" | sed 's/^/  /'
          fi
          if command -v systemd-run >/dev/null 2>&1; then
            echo "flameshot-ocr: resolving bundled runtime deps in 10s (installs only what is missing, or older system Qt)"
            echo "  (same as running: sudo /usr/share/flameshot-ocr/install-deps.sh)"
            systemd-run --on-active=10 --quiet --unit=flameshot-ocr-deps \
              /usr/share/flameshot-ocr/install-deps.sh 2>/dev/null \
              || echo "flameshot-ocr: auto-install could not be scheduled; run the command above manually."
          else
            echo "flameshot-ocr: run this once to install them from the bundled offline deps:"
            echo "  sudo /usr/share/flameshot-ocr/install-deps.sh"
          fi
          EOF
            chmod 755 "${PKGDIR}/DEBIAN/postinst"
            cat > "${PKGDIR}/DEBIAN/control" <<EOF
          Package: flameshot-ocr
          Version: ${VERSION}
          Architecture: ${ARCH}
          Maintainer: flameshot-ocr Kylin/UOS customization
          Section: graphics
          Priority: optional
          Description: Screenshot tool with built-in OCR (Kylin V20 ${ARCH} offline build)
           Same app as the regular deb, plus a bundled runtime dependency
           closure (deps/) and install-deps.sh for machines without network
           access, including the English Tesseract traineddata. Libraries
           already present on the system are used; only missing ones are
           installed from the bundle. Never replace glibc.
           Requires glibc >= 2.31 (Kylin V20 / V10 SP1 / Debian 11 era or newer).
          EOF
            dpkg-deb --build --root-owner-group "${PKGDIR}" "${DEBOUT}"
            # post-build payload self-check: app + installer + a non-empty
            # dependency closure must all be inside the offline deb
            dpkg-deb -c "${DEBOUT}" > /tmp/pkglist-offline.txt
            grep -F "usr/bin/flameshot" /tmp/pkglist-offline.txt > /dev/null \
              || { echo "ERROR: app binary missing from ${DEBOUT}" >&2; exit 1; }
            grep -F "install-deps.sh" /tmp/pkglist-offline.txt > /dev/null \
              || { echo "ERROR: install-deps.sh missing from ${DEBOUT}" >&2; exit 1; }
            N="$(grep -c "flameshot-ocr/deps/.*\.deb" /tmp/pkglist-offline.txt || true)"
            if [ "${N:-0}" -lt 10 ]; then
              echo "ERROR: offline deb carries only ${N:-0} dependency debs — the closure is missing" >&2
              exit 1
            fi
            echo "payload self-check passed for ${DEBOUT} (${N} bundled dependency debs)"
          } 2>&1 | tee -a package.log

      - name: Build binary tarball
        run: |
          set -o pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          tar -C staging -czf "flameshot-ocr-${VERSION}-${{ matrix.osarch }}.tar.gz" . 2>&1 | tee -a package.log

      - name: Collect release files
        run: |
          # flatten: the artifact is downloaded verbatim by the verify job and
          # publish, so keep the debs and tarball at the archive root instead
          # of inside pkg/
          mkdir -p dist
          cp -a pkg/*.deb dist/
          cp -a *.tar.gz dist/
          ls -l dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flameshot-ocr-kylin-${{ matrix.osarch }}
          path: dist/*
          if-no-files-found: error

      - name: Re-emit the failing build log tail as annotations
        if: failure()
        run: |
          # The logs API answers 401/403 to anonymous readers and the job page
          # loads its log client-side, but check-run annotations are public
          # API. GitHub caps annotations at 10 per level per step, so the last
          # 30 lines go out as 10 notice + 10 warning + 10 error, oldest
          # first; every title carries its distance from the end, since
          # identical annotations are merged.
          f=build.log
          [ -f "$f" ] || exit 0
          tail -n 30 "$f" > /tmp/tail.txt
          {
            echo "### tail of \`$f\`"
            echo '```'
            cat /tmp/tail.txt
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          total=$(wc -l < /tmp/tail.txt)
          i=0
          while IFS= read -r line; do
            i=$((i + 1))
            from_end=$((total - i + 1))
            if [ "$from_end" -le 10 ]; then kind=error
            elif [ "$from_end" -le 20 ]; then kind=warning
            else kind=notice
            fi
            printf '::%s title=%s L%d-from-end::%s\n' "$kind" "$f" "$from_end" "$(printf '%s' "$line" | cut -c1-300)"
          done < /tmp/tail.txt

      - name: Re-emit the failing packaging log tail as annotations
        if: failure()
        run: |
          f=package.log
          [ -f "$f" ] || exit 0
          tail -n 30 "$f" > /tmp/tail.txt
          {
            echo "### tail of \`$f\`"
            echo '```'
            cat /tmp/tail.txt
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          total=$(wc -l < /tmp/tail.txt)
          i=0
          while IFS= read -r line; do
            i=$((i + 1))
            from_end=$((total - i + 1))
            if [ "$from_end" -le 10 ]; then kind=error
            elif [ "$from_end" -le 20 ]; then kind=warning
            else kind=notice
            fi
            printf '::%s title=%s L%d-from-end::%s\n' "$kind" "$f" "$from_end" "$(printf '%s' "$line" | cut -c1-300)"
          done < /tmp/tail.txt

      - name: Save logs to ci-logs branch on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const ws = process.env.GITHUB_WORKSPACE || '.';
            const arch = process.env.RUNNER_ARCH === 'ARM64' ? 'aarch64' : 'amd64';
            const stamp = new Date().toISOString().replace(/[^0-9]/g, '').slice(0, 14);
            const files = [];
            for (const n of ['build-deps.log', 'build.log', 'stage.log', 'package.log']) {
              const p = path.join(ws, n);
              if (fs.existsSync(p)) files.push({ name: n.replace(/\.log$/, '') + '-' + arch + '-' + stamp + '.log', p });
            }
            if (files.length === 0) { core.info('no log files found'); return; }
            const { owner, repo } = context.repo;
            let baseCommit = null;
            try {
              const ref = await github.rest.git.getRef({ owner, repo, ref: 'heads/ci-logs' });
              baseCommit = ref.data.object.sha;
            } catch (e) { /* branch does not exist yet */ }
            const tree = [];
            for (const f of files) {
              const blob = await github.rest.git.createBlob({
                owner, repo,
                content: fs.readFileSync(f.p).toString('base64'),
                encoding: 'base64',
              });
              tree.push({ path: f.name, mode: '100644', type: 'blob', sha: blob.data.sha });
            }
            let baseTree;
            if (baseCommit) {
              const c = await github.rest.git.getCommit({ owner, repo, commit_sha: baseCommit });
              baseTree = c.data.tree.sha;
            }
            const newTree = await github.rest.git.createTree({
              owner, repo,
              ...(baseTree ? { base_tree: baseTree } : {}),
              tree,
            });
            const commit = await github.rest.git.createCommit({
              owner, repo,
              message: 'ci log: ' + arch + ' failure at ' + context.sha,
              tree: newTree.data.sha,
              parents: baseCommit ? [baseCommit] : [],
            });
            if (baseCommit) {
              await github.rest.git.updateRef({ owner, repo, ref: 'heads/ci-logs', sha: commit.data.sha, force: true });
            } else {
              await github.rest.git.createRef({ owner, repo, ref: 'refs/heads/ci-logs', sha: commit.data.sha });
            }
            core.info('logs pushed to ci-logs: ' + files.map(f => f.name).join(', '));

  verify-on-kylin:
    name: Install and run on real Kylin V10 SP1 (amd64)
    needs: build-deb
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # distrotwin/kylin: containers bootstrapped from Kylin's public apt
    # archives (github.com/distrotwin/kylin). v10sp1 = 桌面 V10 SP1 (2503),
    # glibc 2.31, GCC 9.3, Ubuntu 20.04 血脉 — 正是本包的目标机。CI 按指南要求
    # 钉带日期的 tag（滚动 tag 会随重建跨版本漂移）。
    container: ghcr.io/distrotwin/kylin:v10sp1-base-amd64-20260903
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Download the deb artifacts
        uses: actions/download-artifact@v4
        with:
          name: flameshot-ocr-kylin-kylin-amd64
          path: debs

      - name: Install the GUI runtime libraries a Kylin desktop provides
        # base 档容器没有桌面运行库；真实麒麟桌面自带。显式从麒麟归档安装，
        # 同时验证 deb 的运行库假设（包名与版本）在真实麒麟源里都成立。
        # libgomp1 is on the list because libqt5gui5 and libtesseract4 need
        # it but the bundled closure deliberately excludes GCC runtime.
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libx11-6 libxcursor1 \
            libxi6 libxrandr2 libgl1 libegl1 libfontconfig1 libfreetype6 libgomp1

      - name: Install the offline deb (dpkg -i, as an offline user would)
        run: |
          dpkg -i debs/flameshot-ocr-*-kylin-amd64-offline.deb
          # capture first, match second: grep -q on a pipe exits at the first
          # match and SIGPIPEs the producer (pipefail then reports failure)
          STAT="$(dpkg -s flameshot-ocr 2>/dev/null || true)"
          case "$STAT" in
            *"Status: install ok installed"*) ;;
            *) echo "flameshot-ocr is not installed cleanly" >&2; exit 1 ;;
          esac

      - name: Run the bundled dependency installer (no systemd in the container)
        # The postinst schedules install-deps.sh via systemd-run when
        # libraries are missing; a container has no init system, so the
        # documented manual fallback IS the offline install path. Capture the
        # full output — a bare tail hides the "dpkg: error processing package
        # X" lines between the "Setting up ..." lines.
        run: |
          set +e
          /usr/share/flameshot-ocr/install-deps.sh > /tmp/install-deps.log 2>&1
          rc=$?
          set -e
          tail -40 /tmp/install-deps.log
          if [ "$rc" -ne 0 ]; then
            {
              echo "---- install-deps.sh failed (rc=$rc), dpkg errors: ----"
              grep -E "dpkg: error|depends on .*; however|Errors were encountered" /tmp/install-deps.log || true
            } >&2
            exit "$rc"
          fi

      - name: ldd gate — zero missing libraries
        run: |
          ldd /usr/bin/flameshot | tee /tmp/ldd.txt
          if grep -F "not found" /tmp/ldd.txt > /dev/null; then
            echo "ERROR: libraries are still missing:" >&2
            grep -F "not found" /tmp/ldd.txt >&2
            exit 1
          fi

      - name: OCR traineddata must be present
        run: |
          ENG="$(find /usr/share -name 'eng.traineddata' -print -quit 2>/dev/null)"
          echo "eng.traineddata: ${ENG:-NOT FOUND}"
          [ -n "$ENG" ] || { echo "ERROR: English traineddata was not installed" >&2; exit 1; }

      - name: The binary must run
        run: |
          /usr/bin/flameshot --version

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-deb, verify-on-kylin]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Create GitHub release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cat > release_notes.md <<'EOF'
          flameshot-ocr custom build for Kylin V20 / V10 SP1 / UOS (glibc 2.31 baseline), amd64 + aarch64.

          - Capture any region, pick the OCR tool (O) and the recognized text
            is copied straight to the clipboard; recognition runs locally via
            Tesseract, fully offline
          - English traineddata is bundled in the -offline packages (install
            extra tesseract-ocr-* language packs for other languages)
          - All Flameshot 12.1.0 capture and annotation features preserved

          Assets:
          - `flameshot-ocr-<version>-kylin-<arch>.deb` — regular package; a
            desktop system provides the runtime libraries the app loads at
            run time
          - `flameshot-ocr-<version>-kylin-<arch>-offline.deb` — for minimal
            or offline machines: bundles the runtime dependency closure
            (Qt5, Tesseract, English traineddata). After `dpkg -i` the
            installer runs automatically (10s delay,
            `journalctl -u flameshot-ocr-deps`), or run
            `sudo /usr/share/flameshot-ocr/install-deps.sh` once.

          Built in a real Kylin V10 SP1 (2503) container (glibc 2.31, Qt
          5.12, Kylin's own package archive) and install-verified on a clean
          Kylin V10 SP1 base image before publishing. Requires glibc >= 2.31:
          Kylin V20 / Ubuntu Kylin (Ubuntu 20.04 base), UOS/deepin desktops,
          Debian 11+. Older systems (UOS 20, glibc 2.28) are not supported —
          glibc cannot be bundled.
          If a distro flameshot package is installed, remove it first (the
          binary is /usr/bin/flameshot).
          EOF
          NOTES_JSON=$(sed 's/\\/\\\\/g; s/"/\\"/g' release_notes.md | awk 'BEGIN{ORS=""} {print $0 "\\n"}')

          API="https://api.github.com/repos/${REPO}"
          AUTH="Authorization: Bearer ${GH_TOKEN}"

          RELEASE_ID=$(curl -sf -X POST -H "$AUTH" -H "Accept: application/vnd.github+json" \
            "$API/releases" \
            -d "{\"tag_name\":\"${TAG_NAME}\",\"name\":\"flameshot-ocr ${TAG_NAME#v} (Kylin)\",\"target_commitish\":\"master\",\"body\":\"${NOTES_JSON}\"}" \
            | grep -o '"id": *[0-9]*' | head -1 | grep -oE '[0-9]+')

          if [ -z "$RELEASE_ID" ]; then
            # release for this tag already exists: reuse it
            RELEASE_ID=$(curl -sf -H "$AUTH" -H "Accept: application/vnd.github+json" \
              "$API/releases/tags/${TAG_NAME}" | grep -o '"id": *[0-9]*' | head -1 | grep -oE '[0-9]+')
          fi
          test -n "$RELEASE_ID"

          for ASSET in $(find assets -type f); do
            curl -sf -X POST -H "$AUTH" -H "Content-Type: application/octet-stream" \
              --data-binary @"$ASSET" \
              "https://uploads.github.com/repos/${REPO}/releases/${RELEASE_ID}/assets?name=$(basename "$ASSET")" > /dev/null \
              || echo "failed to upload $(basename "$ASSET")"
            echo "uploaded asset: $(basename "$ASSET")"
          done
